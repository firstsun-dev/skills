name: Upload Skills to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'custom/**'
      - 'external/**'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up rclone
        run: sudo apt-get install -y rclone

      - name: Configure rclone with OAuth
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [gdrive]
          type = drive
          client_id = ${{ secrets.GDRIVE_CLIENT_ID }}
          client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}
          token = ${{ secrets.GDRIVE_TOKEN }}
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Sync custom/ and external/ to Google Drive
        run: |
          rclone sync custom/   "gdrive:custom/"   --progress
          rclone sync external/ "gdrive:external/" --progress
