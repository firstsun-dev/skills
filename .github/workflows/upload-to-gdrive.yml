name: Upload Skills to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'custom/**'
      - 'external/**'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up rclone
        run: sudo apt-get install -y rclone

      - name: Configure rclone with service account
        run: |
          mkdir -p ~/.config/rclone
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' | base64 -d > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Sync custom/ and external/ to Google Drive
        run: |
          rclone sync custom/   "gdrive:custom/"   --progress
          rclone sync external/ "gdrive:external/" --progress
