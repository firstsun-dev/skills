name: Upload Skills to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'custom/**'
      - 'external/**'
  workflow_dispatch:
    inputs:
      remote_root_folder:
        description: '在 Google Drive 中的目標子資料夾名稱 (Remote Root Folder)'
        required: true
        default: 'yao-ai-skills'

env:
  DEFAULT_REMOTE_FOLDER: 'yao-ai-skills'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up rclone
        uses: rclone/setup-rclone@v1

      - name: Configure rclone with service account
        run: |
          mkdir -p ~/.config/rclone
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' | base64 -d > /tmp/gdrive-sa.json
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          service_account_file = /tmp/gdrive-sa.json
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

      - name: Upload custom/ and external/ to Google Drive
        run: |
          TARGET_FOLDER="${{ github.event.inputs.remote_root_folder || env.DEFAULT_REMOTE_FOLDER }}"
          echo "Uploading to: $TARGET_FOLDER"
          rclone copy custom/   "gdrive:$TARGET_FOLDER/custom/"   --progress
          rclone copy external/ "gdrive:$TARGET_FOLDER/external/" --progress
